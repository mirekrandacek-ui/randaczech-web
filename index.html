<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RandaCzech Studio</title>
<meta name="description" content="Smart apps for everyday life – RandaCzech Studio.">
<meta name="theme-color" content="#07030f">
<style>
:root{--p:#ba5bff;--k:#f36de9;--bg:#07030f}
html{color-scheme:dark}*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background-color:var(--bg);color:#fff;font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden;
background:radial-gradient(60% 50% at 78% 38%,#3a0f7a66,transparent 70%),radial-gradient(80% 30% at 30% -5%,#6a1bd066,transparent 70%),linear-gradient(#0a0418,#07030f) #07030f}
.wave{position:fixed;left:-10%;right:-10%;top:-4%;height:26%;pointer-events:none;opacity:.85;transform:scaleY(-1)}
main{position:relative;height:100dvh;display:grid;grid-template-columns:2fr .8fr;grid-template-rows:1fr auto;gap:0 3vw;padding-block:clamp(14px,3vh,32px);padding-left:max(16px,env(safe-area-inset-left,0px),4vw);padding-right:max(16px,env(safe-area-inset-right,0px),4vw);max-width:1400px;margin:auto}
.left{align-self:center;min-width:0}
h1{font-size:clamp(24px,5.2vw,76px);font-weight:800;letter-spacing:-.02em;white-space:nowrap;line-height:1.05;background:linear-gradient(90deg,#8a4bff,#d65bff 55%,#f36de9);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #a45bff88)}
.rule{height:2px;width:min(46%,380px);margin:clamp(8px,1.8vh,18px) 0;background:linear-gradient(90deg,#9a5bff,transparent)}
.tag{font-size:clamp(17px,3.1vw,42px);font-weight:500;color:#ece4ff;margin-bottom:clamp(8px,2vh,20px)}
ul{list-style:none;padding:0;display:grid;gap:clamp(5px,1.1vh,11px)}
li{display:flex;align-items:center;gap:14px;font-size:clamp(14px,2.3vw,31px);color:#efe9ff}
li i{flex:none;width:1.5em;height:1.5em;border:2px solid #9a6bff;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 10px #8a4bffaa,inset 0 0 8px #8a4bff66}
li i:after{content:"";width:.38em;height:.7em;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-8%,-8%)}
.right{display:flex;align-items:center;justify-content:center;min-height:0}
.logo{width:min(100%,26vh,250px);aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 3px #d65bffaa,0 0 40px 6px #a45bffaa,0 0 120px 20px #7a2bff55}
.logo img{width:100%;height:100%;border-radius:50%;display:block}
.bottom{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:clamp(8px,1.5vw,18px);align-items:center;justify-content:space-between;padding-top:clamp(8px,2vh,18px)}
.apps{display:flex;gap:clamp(8px,1.5vw,18px);flex-wrap:wrap}
.app{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:18px;background:#ffffff0f;border:1px solid #b97bff55;backdrop-filter:blur(8px);box-shadow:0 0 22px #7a2bff33}
.app img{width:clamp(44px,7vh,64px);aspect-ratio:1;border-radius:22%}
.app b{display:block;font-size:clamp(14px,1.5vw,18px)}
.gp{display:inline-block;margin-top:4px;padding:5px 12px;border-radius:999px;background:linear-gradient(90deg,#8a4bff,#d65bff);color:#fff;font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap}
.gp:hover{filter:brightness(1.15)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button.about{font:inherit;color:#fff;background:#ffffff12;border:1px solid #b97bff77;border-radius:999px;padding:8px 16px;cursor:pointer}
button.about:hover{background:#ffffff22}
.lang{display:flex;gap:4px}
.lang button{font:inherit;font-size:12px;font-weight:700;color:#cdbbff;background:transparent;border:1px solid #6a4bb5;border-radius:8px;padding:6px 8px;cursor:pointer}
.lang button.on{background:linear-gradient(90deg,#8a4bff,#d65bff);color:#fff;border-color:transparent}
#panel{position:fixed;left:50%;bottom:calc(clamp(70px,14vh,120px));transform:translateX(-50%) translateY(10px);width:min(92vw,560px);padding:18px 20px;border-radius:18px;background:#14082cf2;border:1px solid #b97bff88;box-shadow:0 0 40px #7a2bff66;opacity:0;pointer-events:none;transition:.2s;font-size:15px;line-height:1.5;color:#efe9ff}
#panel.open{opacity:1;pointer-events:auto;transform:translateX(-50%)}
#panel h2{font-size:17px;margin-bottom:6px;color:#e6b8ff}
footer{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(6px + env(safe-area-inset-bottom,0px));font-size:11px;color:#9b8bc4}
@media (max-width:700px){main{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto}.right{order:-1}.logo{width:min(28vw,16vh)}main{gap:8px}.right{justify-content:flex-start}h1{font-size:clamp(24px,8.4vw,48px)}li{font-size:13px}.left{align-self:start}.tag{font-size:15px}.app{flex:1 1 100%}}
</style>
</head><body>
