<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RandaCzech Studio</title>
<meta name="description" content="Smart apps for everyday life – RandaCzech Studio.">
<meta name="theme-color" content="#07030f">
<link rel="icon" type="image/png" href="assets/brand/profile-icon.png">
<style>
:root{--p:#ba5bff;--k:#f36de9;--bg:#07030f}
html{color-scheme:dark}*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background-color:var(--bg);color:#fff;font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden;
background:radial-gradient(60% 50% at 78% 38%,#3a0f7a66,transparent 70%),radial-gradient(80% 30% at 30% -5%,#6a1bd066,transparent 70%),linear-gradient(#0a0418,#07030f) #07030f}
.wave{position:fixed;left:-10%;right:-10%;top:-4%;height:26%;pointer-events:none;opacity:.85;transform:scaleY(-1)}
main{position:relative;height:100dvh;display:grid;grid-template-columns:2fr .8fr;grid-template-rows:1fr auto;gap:0 3vw;padding-block:clamp(14px,3vh,32px);padding-left:max(16px,env(safe-area-inset-left,0px),4vw);padding-right:max(16px,env(safe-area-inset-right,0px),4vw);max-width:1400px;margin:auto}
.left{align-self:center;min-width:0}
h1{font-size:clamp(24px,5.2vw,76px);font-weight:800;letter-spacing:-.02em;white-space:nowrap;line-height:1.05;background:linear-gradient(90deg,#8a4bff,#d65bff 55%,#f36de9);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px #a45bff88)}
.rule{height:2px;width:min(46%,380px);margin:clamp(8px,1.8vh,18px) 0;background:linear-gradient(90deg,#9a5bff,transparent)}
.tag{font-size:clamp(17px,3.1vw,42px);font-weight:500;color:#ece4ff;margin-bottom:clamp(8px,2vh,20px)}
ul{list-style:none;padding:0;display:grid;gap:clamp(5px,1.1vh,11px)}
li{display:flex;align-items:center;gap:14px;font-size:clamp(14px,2.3vw,31px);color:#efe9ff}
li i{flex:none;width:1.5em;height:1.5em;border:2px solid #9a6bff;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 10px #8a4bffaa,inset 0 0 8px #8a4bff66}
li i:after{content:"";width:.38em;height:.7em;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-8%,-8%)}
.right{display:flex;align-items:center;justify-content:center;min-height:0}
.logo{width:min(100%,26vh,250px);aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 3px #d65bffaa,0 0 40px 6px #a45bffaa,0 0 120px 20px #7a2bff55}
.logo img{width:100%;height:100%;border-radius:50%;display:block}
.bottom{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:clamp(8px,1.5vw,18px);align-items:center;justify-content:space-between;padding-top:clamp(8px,2vh,18px)}
.apps{display:flex;gap:clamp(8px,1.5vw,18px);flex-wrap:wrap}
.app{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:18px;background:#ffffff0f;border:1px solid #b97bff55;backdrop-filter:blur(8px);box-shadow:0 0 22px #7a2bff33}
.app img{width:clamp(44px,7vh,64px);aspect-ratio:1;border-radius:22%}
.app b{display:block;font-size:clamp(14px,1.5vw,18px)}
.gp{display:inline-block;margin-top:4px;padding:5px 12px;border-radius:999px;background:linear-gradient(90deg,#8a4bff,#d65bff);color:#fff;font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap}
.btns{display:flex;gap:6px;flex-wrap:wrap}.btns .gp{margin-top:4px}.gp:hover{filter:brightness(1.15)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button.about{font:inherit;color:#fff;background:#ffffff12;border:1px solid #b97bff77;border-radius:999px;padding:8px 16px;cursor:pointer}
button.about:hover{background:#ffffff22}
.lang{display:flex;gap:4px}
.lang button{font:inherit;font-size:12px;font-weight:700;color:#cdbbff;background:transparent;border:1px solid #6a4bb5;border-radius:8px;padding:6px 8px;cursor:pointer}
.lang button.on{background:linear-gradient(90deg,#8a4bff,#d65bff);color:#fff;border-color:transparent}
#panel{position:fixed;left:50%;bottom:calc(clamp(70px,14vh,120px));transform:translateX(-50%) translateY(10px);width:min(92vw,560px);padding:18px 20px;border-radius:18px;background:#14082cf2;border:1px solid #b97bff88;box-shadow:0 0 40px #7a2bff66;opacity:0;pointer-events:none;transition:.2s;font-size:15px;line-height:1.5;color:#efe9ff}
#panel.open{opacity:1;pointer-events:auto;transform:translateX(-50%)}
#panel h2{font-size:17px;margin-bottom:6px;color:#e6b8ff}
footer{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(6px + env(safe-area-inset-bottom,0px));font-size:11px;color:#9b8bc4}
@media (max-width:700px){main{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto}.right{order:-1}.logo{width:min(28vw,16vh)}main{gap:8px}.right{justify-content:flex-start}h1{font-size:clamp(24px,8.4vw,48px)}li{font-size:13px}.left{align-self:start}.tag{font-size:15px}.app{flex:1 1 100%}}
</style>
</head><body>
<svg class="wave" viewBox="0 0 1200 300" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#5a1bd0" stop-opacity="0"/><stop offset=".5" stop-color="#b95bff"/><stop offset="1" stop-color="#5a1bd0" stop-opacity="0"/></linearGradient></defs><g fill="none" stroke="url(#g)" stroke-width="2"><path d="M0 240C300 140 500 300 800 190S1100 120 1200 150"/><path d="M0 270C320 190 520 310 820 220S1100 170 1200 200" opacity=".6"/><path d="M0 210C300 100 520 270 800 160S1100 90 1200 120" opacity=".4"/></g></svg>
<main>
<section class="left">
<h1>RandaCzech Studio</h1><div class="rule"></div>
<p class="tag" data-t="tag"></p>
<ul><li><i></i><span data-t="b1"></span></li><li><i></i><span data-t="b2"></span></li><li><i></i><span data-t="b3"></span></li><li><i></i><span data-t="b4"></span></li></ul>
</section>
<section class="right"><div class="logo"><img src="assets/web/studio-logo.webp" alt="RandaCzech Studio"></div></section>
<section class="bottom">
<div class="apps">
<div class="app"><img src="assets/web/zeme-mesto.webp" alt=""><div><b data-t="zm"></b><a class="gp" data-t="gp" href="https://play.google.com/store/apps/details?id=com.randis2288.zememesto&referrer=utm_source%3Drandaczech.com%26utm_medium%3Dweb"></a></div></div>
<div class="app"><img src="assets/web/dartscore-pro.webp" alt=""><div><b data-t="ds"></b><div class="btns"><a class="gp" data-t="gp" href="https://play.google.com/store/apps/details?id=com.randis2288.dartscorepro&referrer=utm_source%3Drandaczech.com%26utm_medium%3Dweb"></a><a class="gp" data-t="as" href="https://apps.apple.com/app/id6817341039"></a></div></div></div>
</div>
<div class="tools"><button class="about" id="ab" data-t="about"></button><div class="lang" id="lang"></div></div>
</section>
</main>
<div id="panel"><h2 data-t="about"></h2><p data-t="aboutText"></p></div>
<footer>© 2026 RandaCzech Studio</footer>
<script>
const T={
en:{zm:"Stop: Categories Word Game",ds:"Darts Scoreboard: DartScorePro",tag:"Smart apps for everyday life",b1:"Custom Android & iOS apps",b2:"Clean and simple design",b3:"Intuitive user experience",b4:"Making everyday life easier and more fun",gp:"Get it on Google Play",as:"Get it on App Store",about:"About me",aboutText:"I'm an enthusiastic beginner developer who enjoys building apps. I want to make people's everyday life more fun, and I build everything on a user-friendly approach."},
cs:{zm:"Země Město",ds:"Počítadlo šipek: DartScore Pro",tag:"Chytré aplikace pro každý den",b1:"Aplikace na míru pro Android a iOS",b2:"Čistý a jednoduchý design",b3:"Intuitivní ovládání",b4:"Každodenní život snazší a zábavnější",gp:"Stáhnout na Google Play",as:"Stáhnout z App Store",about:"O mně",aboutText:"Jsem nadšený začínající vývojář a vývoj aplikací mě baví. Chci lidem zpříjemnit a zpestřit každodenní život a všechno stavím na uživatelsky přívětivém přístupu."},
de:{zm:"Stadt Land Fluss: Wortspiel",ds:"Dartzähler: DartScore Pro",tag:"Smarte Apps für den Alltag",b1:"Individuelle Android- & iOS-Apps",b2:"Klares, einfaches Design",b3:"Intuitive Bedienung",b4:"Den Alltag leichter und unterhaltsamer machen",gp:"Jetzt bei Google Play",as:"Jetzt im App Store",about:"Über mich",aboutText:"Ich bin ein begeisterter Einsteiger in der App-Entwicklung und baue gern Apps. Ich möchte den Alltag der Menschen unterhaltsamer machen und setze dabei auf Benutzerfreundlichkeit."},
es:{zm:"Basta: Juego de Categorías",ds:"Dardos: marcador DartScore Pro",tag:"Apps inteligentes para el día a día",b1:"Apps a medida para Android e iOS",b2:"Diseño limpio y sencillo",b3:"Experiencia de usuario intuitiva",b4:"Hacer la vida diaria más fácil y divertida",gp:"Disponible en Google Play",as:"Disponible en App Store",about:"Sobre mí",aboutText:"Soy un desarrollador principiante y entusiasta al que le encanta crear apps. Quiero hacer la vida diaria de las personas más divertida y baso todo en un enfoque fácil de usar."},
pl:{zm:"Państwa Miasta: Gra słowna",ds:"Dart Score Pro: Darts App",tag:"Inteligentne aplikacje na co dzień",b1:"Aplikacje na Androida i iOS na zamówienie",b2:"Czysty i prosty design",b3:"Intuicyjna obsługa",b4:"Codzienne życie łatwiejsze i fajniejsze",gp:"Pobierz z Google Play",as:"Pobierz z App Store",about:"O mnie",aboutText:"Jestem zapalonym początkującym programistą i lubię tworzyć aplikacje. Chcę uprzyjemnić ludziom codzienne życie, a wszystko opieram na przyjaznym dla użytkownika podejściu."},
ru:{zm:"Страны и города: Словесная игра",ds:"Дартс счётчик: DartScore Pro",tag:"Умные приложения на каждый день",b1:"Приложения для Android и iOS на заказ",b2:"Чистый и простой дизайн",b3:"Интуитивный интерфейс",b4:"Делаем повседневную жизнь проще и веселее",gp:"Доступно в Google Play",as:"Доступно в App Store",about:"Обо мне",aboutText:"Я увлечённый начинающий разработчик, мне нравится создавать приложения. Хочу сделать повседневную жизнь людей веселее, а в основе всего — удобство для пользователя."}};
const L=[["en","EN"],["cs","CZ"],["de","DE"],["es","ES"],["pl","PL"],["ru","RU"]],box=document.getElementById("lang");
function set(l,remember=false){document.documentElement.lang=l;document.querySelectorAll("[data-t]").forEach(e=>e.textContent=T[l][e.dataset.t]);box.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.l==l));if(remember){try{localStorage.setItem("lang",l)}catch(e){}}}
L.forEach(([c,n])=>{const b=document.createElement("button");b.textContent=n;b.dataset.l=c;b.onclick=()=>set(c,true);box.appendChild(b)});
let l=null;try{l=localStorage.getItem("lang")}catch(e){}
if(!T[l]){const supported=new Set(L.map(([c])=>c));const preferred=navigator.languages?.length?navigator.languages:[navigator.language||"en"];l=preferred.map(x=>String(x).toLowerCase().split("-")[0]).find(x=>supported.has(x))||"en";}
set(l);
const p=document.getElementById("panel");document.getElementById("ab").onclick=e=>{e.stopPropagation();p.classList.toggle("open")};document.addEventListener("click",()=>p.classList.remove("open"));
</script>

</body></html>
